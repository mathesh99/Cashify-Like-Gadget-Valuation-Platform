<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" width="260" height="54" fill="none">
  <defs>
    <linearGradient id="cmpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="cmpBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g filter="url(#iconShadow)">
    <rect x="2" y="7" width="40" height="40" rx="12" fill="url(#cmpGrad)" />
    <!-- Glass Highlight Sheen -->
    <path d="M4 16C4 11.0294 8.02944 7 13 7H31C35.9706 7 40 11.0294 40 16C40 16 34 20 22 20C10 20 4 16 4 16Z" fill="white" fill-opacity="0.2" />
    <!-- Phone Silhouette -->
    <rect x="12" y="13" width="20" height="26" rx="4" stroke="white" stroke-width="1.8" stroke-opacity="0.88" fill="none" />
    <!-- Speaker Notch -->
    <line x1="18" y1="15.5" x2="26" y2="15.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Electric Trade-In Lightning Bolt -->
    <path d="M23.5 18L17.5 26H22L20.5 34L27.5 25.5H22.5L23.5 18Z" fill="url(#cmpBolt)" />
    <!-- Home Sensor Dot -->
    <circle cx="22" cy="36" r="1.1" fill="white" fill-opacity="0.9" />
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(54, 0)">
    <!-- Main Title -->
    <text x="0" y="29" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" letter-spacing="-0.8" fill="#0f172a">
      Cell<tspan fill="url(#textGrad)">Master</tspan>
    </text>

    <!-- PRO Pill Badge -->
    <g transform="translate(132, 14)">
      <rect width="36" height="18" rx="5" fill="#0f172a" />
      <circle cx="7" cy="9" r="2" fill="#10b981" />
      <text x="13" y="12.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="900" letter-spacing="1.2" fill="#ffffff">PRO</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="1" y="43" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="800" letter-spacing="2" fill="#64748b">
      SMART RE-COMMERCE
    </text>
  </g>
</svg>